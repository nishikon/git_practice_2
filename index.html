<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ページの説明をここに書きます">
  <title>サイトタイトル</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #5c6570;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-header,
    .site-footer {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .site-footer {
      border-bottom: none;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    .container {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .site-header .container,
    .site-footer .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }

    .logo {
      font-weight: 700;
      color: var(--text);
    }

    nav ul {
      display: flex;
      gap: 1.25rem;
      list-style: none;
    }

    main {
      padding: 2.5rem 0;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .hero h1 {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      margin-bottom: 0.75rem;
    }

    .hero p {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
    }

    .btn:hover {
      text-decoration: none;
      opacity: 0.92;
    }

    .section {
      margin-top: 2rem;
    }

    .section h2 {
      margin-bottom: 0.75rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .card h3 {
      margin-bottom: 0.4rem;
    }

    .card p {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="./index.html">サイト名</a>
      <nav>
        <ul>
          <li><a href="#about">概要</a></li>
          <li><a href="#features">特徴</a></li>
          <li><a href="#contact">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
    

        <h1>gitの練習</h1>
        <p>リード文をここに書きます。このテンプレートはヘッダー、メイン、フッターの基本構成です。</p>
        <p>git diff</p>
        <a class="btn" href="#features">詳しく見る</a>
        

      </section>

      <section class="section" id="about">
        <h2>概要</h2>
        <p>ここにページの説明や自己紹介などを追加してください。</p>
      </section>

      <section class="section" id="features">
        <h2>特徴</h2>
        <div class="card-grid">
          <article class="card">
            <h3>項目 1</h3>
            <p>カードの説明文をここに書きます。</p>
          </article>
          <article class="card">
            <h3>項目 2</h3>
            <p>カードの説明文をここに書きます。</p>
          </article>
          <article class="card">
            <h3>項目 3</h3>
            <p>カードの説明文をここに書きます。</p>
          </article>
        </div>
      </section>

      <section class="section" id="contact">
        <h2>お問い合わせ</h2>
        <p>連絡先やリンクをここに追加してください。</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2026 サイト名</small>
    </div>
  </footer>
</body>
</html>
